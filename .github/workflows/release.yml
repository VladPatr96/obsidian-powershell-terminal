name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node esbuild.config.mjs production
        env:
          # Override vault path — CI builds to a temp dir
          CI_BUILD: 'true'

      - name: Package release
        run: node scripts/package-release.mjs
        env:
          CI_BUILD: 'true'

      - name: Copy individual files for release
        run: |
          copy release\powershell-terminal\main.js release\main.js
          copy release\powershell-terminal\manifest.json release\manifest.json
          copy release\powershell-terminal\styles.css release\styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/powershell-terminal.zip
            release/node-pty-win32-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
